version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-deepshield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
  
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /artifacts
    ports: ["5000:5000"]
    volumes: [mlflow:/artifacts]
  
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes: ["./ml:/app/ml:ro", "./uploads:/app/uploads"]
  
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on: [backend]

volumes:
  pgdata:
  mlflow:
